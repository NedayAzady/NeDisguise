# NeDisguise Main Configuration

mysql:
  enabled: false
  host: "localhost"
  port: 3306
  database: "disguise"
  username: "root"
  password: ""

messages:
  no_permission: "&cYou do not have permission to use this command."
  disguised: "&aYou are now disguised as {name} with the {rank} rank!"
  undisguised: "&eYour disguise has been removed."
  redisguised: "&aReapplied your previous disguise ({name} / {rank})!"
  no_previous_disguise: "&cYou do not have a previous disguise to reapply."
  cancel_disguise: "&cDisguise cancelled."
  name_too_long: "&cName must be 16 characters or less."
  invalid_name: "&cInvalid name format. Use alphanumeric characters and underscores."

# Commands to run to support TAB/NTE plugin or other plugins
on_disguise_commands:
  - "nte player {player} prefix {prefix} "
  - "tab player {player} customtabname {name}"
  
on_undisguise_commands:
  - "nte player {player} clear"
  - "tab player {player} customtabname"

sounds:
  click: "CLICK"
  success: "LEVEL_UP"
  error: "VILLAGER_NO"
  cancel: "NOTE_BASS"
