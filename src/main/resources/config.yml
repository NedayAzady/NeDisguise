# NeDisguise Configuration

permission: "disguise.perm"

commands:
  - "/disguise"
  - "/nick"

mysql:
  enabled: false
  host: "localhost"
  port: 3306
  database: "disguise"
  username: "root"
  password: ""

messages:
  no_permission: "&cYou do not have permission to use this command."
  disguised: "&aYou are now disguised as {name} with the {rank} rank!"
  undisguised: "&eYour disguise has been removed."
  cancel_disguise: "&cDisguise cancelled."
  type_name_in_chat: "&ePlease enter your desired disguise name in the sign."
  name_too_long: "&cName must be 16 characters or less."
  invalid_name: "&cInvalid name format. Use alphanumeric characters and underscores."

# Commands to run to support TAB plugin or other plugins
on_disguise_commands:
  - "tab player {player} customtabname {name}"
  - "tab player {player} tagprefix &7" # You can customize these if needed
  
on_undisguise_commands:
  - "tab player {player} customtabname" # Running it with no value clears it in NEZAMY Tab
  - "tab player {player} tagprefix"

gui:
  filler:
    material: STAINED_GLASS_PANE
    data: 15
    name: " "
  ranks:
    title: "&8Select Disguise Rank"
    size: 54
    next_button:
      material: ARROW
      name: "&aNext Page"
      slot: 50
    previous_button:
      material: ARROW
      name: "&cPrevious Page"
      slot: 48
    page_indicator:
      material: BOOK
      name: "&ePage {page}/{max}"
      slot: 49
    unnick_button:
      material: BARRIER
      name: "&cReset Disguise"
      lore:
        - "&7Click to remove your"
        - "&7current disguise."
      slot: 53
    cancel_button:
      material: REDSTONE_BLOCK
      name: "&cCancel"
      slot: 45
    # Default ranks mapping to LuckPerms
    groups:
      - "default"
      - "vip"
      - "pro"
      - "mvp"
      - "ace"
    rank_item:
      material: PAPER
      name: "{prefix} {group_name}"
      lore:
        - "&7Click to select this rank"
  
  skins:
    title: "&8Select Disguise Skin"
    size: 54
    next_button:
      material: ARROW
      name: "&aNext Page"
      slot: 50
    previous_button:
      material: ARROW
      name: "&cPrevious Page"
      slot: 48
    page_indicator:
      material: BOOK
      name: "&ePage {page}/{max}"
      slot: 49
    back_button:
      material: BARRIER
      name: "&cBack to Ranks"
      slot: 45
    custom_name_button:
      material: NAME_TAG
      name: "&eCustom Name"
      lore:
        - "&7Click to enter a custom name"
      slot: 53
    random_name_button:
      material: COMMAND
      name: "&dRandom Nickname & Skin"
      lore:
        - "&7Click to get a completely"
        - "&7random nickname and skin!"
      slot: 0
