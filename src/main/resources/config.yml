# NeDisguise Configuration

permission: "disguise.perm"

commands:
  - "/disguise"
  - "/nick"

mysql:
  enabled: false
  host: "localhost"
  port: 3306
  database: "disguise"
  username: "root"
  password: ""

messages:
  no_permission: "&cYou do not have permission to use this command."
  disguised: "&aYou are now disguised as {name} with the {rank} rank!"
  undisguised: "&eYour disguise has been removed."
  cancel_disguise: "&cDisguise cancelled."
  type_name_in_chat: "&ePlease enter your desired disguise name in the sign."
  name_too_long: "&cName must be 16 characters or less."
  invalid_name: "&cInvalid name format. Use alphanumeric characters and underscores."

# Commands to run to support TAB plugin or other plugins
on_disguise_commands:
  - "tab player {player} customtabname {name}"
  - "tab player {player} customtagname {name}"
  
on_undisguise_commands:
  - "tab player {player} customtabname clear"
  - "tab player {player} customtagname clear"

gui:
  filler:
    material: STAINED_GLASS_PANE
    data: 15
    name: " "
  ranks:
    title: "&8Select Disguise Rank"
    size: 54
    next_button:
      material: ARROW
      name: "&aNext Page"
      slot: 50
    previous_button:
      material: ARROW
      name: "&cPrevious Page"
      slot: 48
    page_indicator:
      material: BOOK
      name: "&ePage {page}/{max}"
      slot: 49
    cancel_button:
      material: REDSTONE_BLOCK
      name: "&cCancel"
      slot: 45
    # Default ranks mapping to LuckPerms
    groups:
      - "default"
      - "vip"
      - "vip_plus"
      - "pro"
      - "pro_plus"
      - "mvp"
      - "mvp_plus"
      - "ace"
      - "ace_plus"
      - "hero"
      - "legend"
      - "titan"
      - "mythic"
      - "god"
      - "immortal"
      - "champion"
      - "master"
      - "overlord"
      - "supreme"
      - "celestial"
      - "galactic"
      - "universal"
    rank_item:
      material: PAPER
      name: "{prefix} {group_name}"
      lore:
        - "&7Click to select this rank"
  
  skins:
    title: "&8Select Disguise Skin"
    size: 54
