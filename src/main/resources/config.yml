# NeDisguise Configuration

permission: "disguise.perm"

commands:
  - "/disguise"
  - "/nick"

mysql:
  enabled: false
  host: "localhost"
  port: 3306
  database: "disguise"
  username: "root"
  password: ""

messages:
  no_permission: "&cYou do not have permission to use this command."
  disguised: "&aYou are now disguised as {name} with the {rank} rank!"
  undisguised: "&eYour disguise has been removed."
  cancel_disguise: "&cDisguise cancelled."
  type_name_in_chat: "&ePlease type your desired disguise name in the chat (or type 'cancel' to cancel):"
  name_too_long: "&cName must be 16 characters or less."
  invalid_name: "&cInvalid name format. Use alphanumeric characters and underscores."

gui:
  ranks:
    title: "&8Select Disguise Rank"
    size: 54
    next_button:
      material: EMERALD_BLOCK
      name: "&aNext Page"
      slot: 53
    cancel_button:
      material: REDSTONE_BLOCK
      name: "&cCancel"
      slot: 45
    # Default ranks mapping to LuckPerms
    # The plugin will fetch prefix/suffix from LuckPerms for these groups
    groups:
      - "default"
      - "vip"
      - "pro"
      - "mvp"
      - "ace"
    rank_item:
      material: PAPER
      name: "{prefix} {group_name}"
      lore:
        - "&7Click to select this rank"
  
  skins:
    title: "&8Select Disguise Skin"
    size: 54
    custom_name_button:
      material: NAME_TAG
      name: "&eCustom Name"
      lore:
        - "&7Click to enter a custom name"
      slot: 49
    available_skins:
      - name: "Notch"
        texture: ""
      - name: "Dinnerbone"
        texture: ""

  confirm:
    title: "&8Confirm Disguise"
    size: 54
    confirm_button:
      material: EMERALD_BLOCK
      name: "&aDisguise"
      slot: 31
    cancel_button:
      material: REDSTONE_BLOCK
      name: "&cCancel"
      slot: 30

sounds:
  click: "UI_BUTTON_CLICK"
  success: "ENTITY_PLAYER_LEVELUP"
  error: "ENTITY_VILLAGER_NO"
  cancel: "BLOCK_NOTE_BLOCK_BASS"
